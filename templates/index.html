<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Сканер Маркировки</title>
    <!-- Подключаем надежную версию библиотеки сканера -->
    <script src="https://unpkg.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; margin: 0; padding: 15px; background: #f8f9fa; color: #212529; }
        #reader { width: 100%; max-width: 360px; margin: 10px auto; border-radius: 12px; overflow: hidden; border: 2px solid #007bff; background: #000; min-height: 250px; display: none; }
        .btn { display: block; width: 100%; max-width: 360px; margin: 12px auto; padding: 16px; font-size: 18px; border: none; border-radius: 10px; background: #007bff; color: white; font-weight: bold; box-shadow: 0 4px 6px rgba(0,123,255,0.15); cursor: pointer; }
        .btn:active { transform: scale(0.98); }
        .btn-success { background: #28a745; box-shadow: 0 4px 6px rgba(40,167,69,0.15); }
        .btn-danger { background: #dc3545; }
        #torch-btn { display: none; background: #6c757d; }
        #result-box { display: none; margin-top: 20px; }
        #qr-img { max-width: 90%; height: auto; border: 3px solid #28a745; border-radius: 12px; margin: 15px 0; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .input-box { margin: 25px auto; max-width: 360px; text-align: left; }
        .input-box input { width: 100%; padding: 14px; font-size: 16px; border: 2px solid #6c757d; border-radius: 8px; box-sizing: border-box; }
        #status { font-size: 16px; font-weight: bold; color: #495057; margin: 15px 0; background: #e9ecef; padding: 10px; border-radius: 6px; display: inline-block; }
    </style>
</head>
<body>

    <div id="scan-flow">
        <h2>Сканирование Data Matrix</h2>
        
        <!-- Кнопка явного старта, чтобы обойти блокировку браузеров -->
        <button class="btn btn-success" id="start-camera-btn" onclick="requestAndStartCamera()">ВКЛЮЧИТЬ КАМЕРУ</button>
        
        <div id="reader"></div>
        <button class="btn" id="torch-btn" onclick="toggleTorch()">Включить фонарик</button>
        
        <div class="input-box">
            <label for="fallback-input"><b>Резервное поле для клавиатуры-сканера:</b></label>
            <input type="text" id="fallback-input" placeholder="Нажмите сюда и используйте сканер телефона">
        </div>
    </div>

    <div id="status">Нажмите кнопку «ВКЛЮЧИТЬ КАМЕРУ» выше</div>

    <div id="result-box">
        <h3>Готовый QR-код упаковки:</h3>
        <img id="qr-img" src="" alt="Сгенерированный QR-код">
        <button class="btn btn-danger" onclick="window.location.reload()">Сбросить / Сканировать заново</button>
    </div>

    <script>
        const sessionId = "{{ session_id }}";
        let html5QrCode;
        let pollTimer;
        let torchActive = false;

        // Пошаговый запуск камеры по клику пользователя
        function requestAndStartCamera() {
            document.getElementById("status").innerText = "Запрашиваю доступ к камерам...";
            
            // Создаем объект сканера внутри блока #reader
            html5QrCode = new Html5Qrcode("reader");
            
            // Запрашиваем список всех доступных камер устройства
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length > 0) {
                    // Ищем заднюю камеру (в названии обычно есть back, rear или environment)
                    let backCameraId = null;
                    for (let i = 0; i < devices.length; i++) {
                        const label = devices[i].label.toLowerCase();
                        if (label.includes("back") || label.includes("rear") || label.includes("environment")) {
                            backCameraId = devices[i].id;
                            break;
                        }
                    }
                    
                    // Если заднюю камеру по названию не нашли, берем самую последнюю в списке (у смартфонов это обычно основная задняя)
                    if (!backCameraId) {
                        backCameraId = devices[devices.length - 1].id;
                    }
                    
                    // Скрываем кнопку старта и показываем окно камеры
                    document.getElementById("start-camera-btn").style.display = "none";
                    document.getElementById("reader").style.display = "block";
                    
                    // Запускаем видеопоток
                    html5QrCode.start(
                        backCameraId,
                        { 
                            fps: 10, 
                            qrbox: function(width, height) {
                                // Делаем квадратную зону сканирования адаптивной под экран смартфона
                                const minEdge = Math.min(width, height);
                                const boxSize = Math.floor(minEdge * 0.7);
                                return { width: boxSize, height: boxSize };
                            }
                        },
                        (text) => { sendCode(text); }, // Сработает при успешном сканировании
                        (err) => { /* Поиск кода в кадре... */ }
                    ).then(() => {
                        document.getElementById("status").innerText = "Ожидание маркировки. Наведите на Data Matrix...";
                        document.getElementById("torch-btn").style.display = "block";
                    }).catch(err => {
                        document.getElementById("status").innerText = "Ошибка запуска выбранной камеры. Проверьте разрешения в настройках телефона.";
                        console.error(err);
                    });
                    
                } else {
                    document.getElementById("status").innerText = "Камеры не обнаружены на этом устройстве.";
                }
            }).catch(err => {
                document.getElementById("status").innerText = "Браузер заблокировал доступ к камере. Измените разрешения.";
                console.error(err);
            });
        }

        function toggleTorch() {
            if (html5QrCode && html5QrCode.isScanning) {
                torchActive = !torchActive;
                html5QrCode.applyVideoConstraints({ advanced: [{ torch: torchActive }] })
                    .then(() => {
                        document.getElementById("torch-btn").innerText = torchActive ? "Выключить фонарик" : "Включить фонарик";
                    }).catch(() => alert("Фонарик на этом устройстве недоступен для браузера (ограничение iOS Safari или модели телефона)"));
            }
        }

        function sendCode(code) {
            if (!code.trim()) return;
            
            // Останавливаем камеру, чтобы не тратить батарею
            if (html5QrCode && html5QrCode.isScanning) { 
                html5QrCode.stop().catch(() => {}); 
            }
            
            document.getElementById("scan-flow").style.display = "none";
            document.getElementById("status").innerText = "Код получен! Локальный робот на ПК обрабатывает запрос...";

            // Отправляем текст маркировки на Render
            fetch('/submit_code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId, code: code })
            }).then(() => {
                // Запускаем регулярную проверку готовности ответа
                pollTimer = setInterval(waitResult, 1500);
            });
        }

        // Следим за резервным текстовым полем
        document.getElementById("fallback-input").addEventListener("input", function() {
            if (this.value.length > 10) { sendCode(this.value); }
        });

        // Опрос сервера
        function waitResult() {
            fetch(`/get_result?session_id=${sessionId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.result) {
                        clearInterval(pollTimer);
                        document.getElementById("status").style.display = "none";
                        document.getElementById("qr-img").src = "data:image/png;base64," + data.result;
                        document.getElementById("result-box").style.display = "block";
                    }
                });
        }
    </script>
</body>
</html>
